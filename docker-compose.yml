name: tidepool-rehearsal
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Run npm run compose}
    volumes:
      - tidepool_data:/var/lib/postgresql/data
      - ./deploy/auth-init.sql:/docker-entrypoint-initdb.d/10-auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://gateway:8080/auth/v1
      GOTRUE_SITE_URL: http://127.0.0.1:3207
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${PG_PASSWORD}@postgres:5432/postgres?search_path=auth
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
  gateway:
    image: nginx:stable-alpine
    depends_on: [auth]
    volumes: [./deploy/auth-gateway.conf:/etc/nginx/conf.d/default.conf:ro]
  mail:
    image: public.ecr.aws/supabase/mailpit:v1.31.3
    ports: ["127.0.0.1:58434:8025"]
  bootstrap:
    build: .
    image: tidepool:local
    depends_on: [gateway]
    command: ["node","scripts/bootstrap.mjs"]
    environment:
      OWNER_DATABASE_URL: postgres://postgres:${PG_PASSWORD}@postgres:5432/postgres
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD}
      SUPABASE_URL: http://gateway:8080
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      COMMITTEE_EMAIL: ${COMMITTEE_EMAIL}
      COMMITTEE_PASSWORD: ${COMMITTEE_PASSWORD}
  api:
    image: tidepool:local
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      mail: {condition: service_started}
    command: ["node","backend/dist/main.js"]
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 4107
      PUBLIC_ORIGIN: http://127.0.0.1:3207
      DATABASE_URL: postgres://tidepool_app:${DB_RUNTIME_PASSWORD}@postgres:5432/postgres
      SUPABASE_URL: http://gateway:8080
      SUPABASE_KEY: ${SUPABASE_KEY}
      OTP_SECRET: ${OTP_SECRET}
      SMTP_HOST: mail
      SMTP_PORT: 1025
      MAIL_FROM: "Tidepool <events@tidepool.test>"
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:4107/health/ready').then(x=>process.exit(x.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    image: tidepool:local
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:3207:3107"]
    environment:
      PUBLIC_ORIGIN: http://127.0.0.1:3207
      API_INTERNAL_URL: http://api:4107
volumes:
  tidepool_data: {}
