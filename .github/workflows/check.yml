name: Tidepool checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run format:check
      - run: npm run setup
      - run: npm run build && npm audit --audit-level=low
      - run: npm run test:unit
      - name: Run integration tests against Supabase Postgres and Auth
        run: |
          node --env-file=.env.local backend/dist/main.js > /tmp/tidepool-api.log 2>&1 &
          npm run start:web -- --hostname 127.0.0.1 > /tmp/tidepool-web.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3107/health/ready && break; sleep 1; done
          npm test
          npx playwright install --with-deps chrome
          npm run test:browser
